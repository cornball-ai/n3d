# Run CI for R using https://eddelbuettel.github.io/r-ci/

name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"
  TORCH_HOME: /tmp/torch

jobs:
  R-CMD-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest}
          - {os: ubuntu-latest}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # backend must be an action input: the action exports BACKEND from its
      # input before calling run.sh, so a workflow-level env is overwritten.
      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          backend: RAPT

      - name: Dependencies
        run: ./run.sh install_all

      - name: Install torch
        run: |
          mkdir -p $TORCH_HOME
          Rscript -e 'torch::install_torch()'

      - name: Test
        run: ./run.sh run_tests
